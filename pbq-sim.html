<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security+ PBQ Simulator</title>
<style>
  :root{ --blue:#1f4e79; --blue2:#2e75b6; --line:#c9d4e0; --bg:#eef1f5; --ink:#1a1a1a; --ok:#1e7d32; --bad:#b3261e; --warn:#e6a100; }
  *{ box-sizing:border-box; font-family:"Segoe UI", Arial, sans-serif; }
  body{ margin:0; background:var(--bg); color:var(--ink); }
  header{ background:var(--blue); color:#fff; padding:10px 18px; display:flex; justify-content:space-between; align-items:center; }
  header .t{ font-size:17px; font-weight:600; }
  header .meta{ font-size:14px; display:flex; gap:22px; align-items:center; }
  #timer{ font-variant-numeric:tabular-nums; font-weight:700; padding:3px 10px; background:rgba(255,255,255,.15); border-radius:4px; }
  #timer.low{ background:var(--bad); }
  main{ max-width:1060px; margin:18px auto 110px; padding:0 14px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:20px 22px; }
  h2{ margin:0 0 4px; font-size:19px; }
  .sub{ color:#555; font-size:13px; margin-bottom:14px; }
  .scenario{ background:#f6f9fc; border-left:4px solid var(--blue2); padding:12px 14px; font-size:15px; line-height:1.5; white-space:pre-wrap; }
  .instr{ margin:14px 0 8px; font-weight:600; font-size:15px; }
  .logbox{ background:#111; color:#d6e4d6; font-family:Consolas, monospace; font-size:13px; padding:12px 14px; border-radius:4px; white-space:pre-wrap; line-height:1.55; margin:10px 0; }
  table.grid{ border-collapse:collapse; width:100%; margin-top:8px; }
  table.grid th, table.grid td{ border:1px solid var(--line); padding:6px; font-size:14px; text-align:left; }
  table.grid th{ background:#eaf1f8; }
  select{ font-size:14px; padding:4px; max-width:100%; }
  .opt{ display:block; padding:8px 10px; border:1px solid var(--line); border-radius:4px; margin:6px 0; cursor:pointer; font-size:15px; background:#fff; }
  .opt:hover{ border-color:var(--blue2); }
  .opt.sel{ background:#e3eefb; border-color:var(--blue2); }
  .orditem{ display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:4px; margin:6px 0; background:#fff; font-size:15px; cursor:grab; }
  .orditem.drag{ opacity:.4; }
  .orditem .pos{ font-weight:700; color:var(--blue); width:22px; }
  .orditem .mv{ margin-left:auto; }
  .orditem button{ border:1px solid var(--line); background:#f2f5f9; border-radius:3px; cursor:pointer; padding:2px 8px; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .seg button{ border:0; background:#fff; padding:6px 16px; cursor:pointer; font-size:14px; }
  .seg button.on{ background:var(--ok); color:#fff; }
  .seg button.off{ background:var(--bad); color:#fff; }
  .togglerow{ display:flex; justify-content:space-between; align-items:center; padding:8px 4px; border-bottom:1px solid #e6ebf1; font-size:15px; }
  footer{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:10px 18px; display:flex; justify-content:space-between; align-items:center; }
  .btn{ background:var(--blue2); color:#fff; border:0; padding:9px 18px; border-radius:4px; font-size:15px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--blue); border:1px solid var(--blue2); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.warn{ background:#fff; color:var(--bad); border:1px solid var(--bad); }
  #palette{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9; }
  #palette .box{ background:#fff; max-width:520px; margin:70px auto; border-radius:6px; padding:20px; }
  .pgrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:12px 0; }
  .pgrid button{ padding:10px 0; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; font-size:14px; }
  .pgrid button.ans{ background:#e3eefb; }
  .pgrid button.cur{ outline:2px solid var(--blue2); }
  .pgrid button.flg{ box-shadow:inset 0 -4px 0 var(--warn); }
  .score{ font-size:16px; line-height:1.6; }
  .rev{ border-top:1px solid var(--line); margin-top:16px; padding-top:12px; }
  .rev .q{ font-weight:700; margin-top:12px; }
  .pct{ font-weight:700; }
  .good{ color:var(--ok); } .poor{ color:var(--bad); }
  .rat{ background:#f6f9fc; border-left:4px solid var(--ok); padding:8px 12px; font-size:14px; margin:6px 0; white-space:pre-wrap; }
  .flagline{ font-size:13px; color:#a66a00; }
  .startbox{ text-align:left; }
  .startbox li{ margin:6px 0; font-size:15px; line-height:1.45; }
</style>
</head>
<body>
<header>
  <div class="t">CompTIA Security+ (SY0-701) — PBQ Simulation</div>
  <div class='meta'><span id="qcount"></span><span id="timer">--:--</span></div>
</header>
<main id="app"></main>
<div id="palette"><div class="box">
  <h2>Question review</h2>
  <div class="sub">Jump to a question. Answered questions are shaded; flagged questions have an amber bar.</div>
  <div class="pgrid" id="pgrid"></div>
  <button class="btn" onclick="closePalette()">Back to exam</button>
  <button class="btn warn" onclick="finishExam(false)">Submit exam</button>
</div></div>
<footer id="nav" style="display:none">
  <div>
    <button class="btn ghost" id="prevBtn" onclick="goto(state.idx-1)">◀ Previous</button>
    <button class="btn ghost" onclick="openPalette()">Review / Submit</button>
  </div>
  <div>
    <button class="btn ghost" id="flagBtn" onclick="toggleFlag()">⚑ Flag</button>
    <button class="btn ghost" onclick="resetQ()">Reset question</button>
    <button class="btn" id="nextBtn" onclick="goto(state.idx+1)">Next ▶</button>
  </div>
</footer>
<script>
/* ================= CONTENT (replaced after audit) ================= */
const PBQ_DATA = {
  title: "Security+ PBQ Sprint — Sample Set",
  timeLimitMin: 45,
  questions: [
    {
      id: "sample-order", type: "order",
      title: "SAMPLE — Incident Response Sequencing (mechanics demo)",
      scenario: "These two sample questions use scenarios you have already worked, so you can test the simulator itself. The scored set replaces this data after the audit.\n\nA hospital's EDR alert fl[...]",
      instructions: "Arrange ALL seven incident response phases in the order they occur.",
      items: ["Containment","Lessons Learned","Preparation","Recovery","Analysis","Eradication","Detection"],
      answer: ["Preparation","Detection","Analysis","Containment","Eradication","Recovery","Lessons Learned"],
      rationale: "SY0-701 objective 4.8 order: Preparation → Detection → Analysis → Containment → Eradication → Recovery → Lessons Learned."
    },
    {
      id: "sample-acl", type: "dropdown-grid",
      title: "SAMPLE — Firewall Rule Builder (mechanics demo)",
      scenario: "Northgate Library. The public catalog web server sits in the DMZ at 172.20.3.15. Policy: (1) the public may reach it over secure web traffic only; (2) nothing in the DMZ may initiate [...]",
      instructions: "Complete both rules. Every field must be set.",
      columns: ["Action","Protocol","Source","Destination","Port"],
      colOptions: {
        "Action": ["Allow","Deny"],
        "Protocol": ["TCP","UDP","Any"],
        "Source": ["Any","172.20.3.15","172.20.3.0/24","172.20.5.0/24"],
        "Destination": ["Any","172.20.3.15","172.20.3.0/24","172.20.5.0/24"],
        "Port": ["Any","80","443","22","3389"]
      },
      rows: [
        { label: "Rule 1 — public web access", answer: ["Allow","TCP","Any","172.20.3.15","443"] },
        { label: "Rule 2 — DMZ to LAN", answer: ["Deny","Any","172.20.3.0/24","172.20.5.0/24","Any"] }
      ],
      rationale: "Rule 1: HTTPS is TCP 443; the public = Any source; one host as destination. Rule 2: a blanket DMZ→LAN deny, all protocols and ports, placed after the allow."
    }
  ]
};

const state = {
  idx: 0,
  answers: {},
  flags: new Set(),
  touched: new Set(),
  started: false,
  submitted: false,
  deadline: null,
  tick: null
};

const app = document.getElementById('app');
const nav = document.getElementById('nav');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function touch(qid){ state.touched.add(qid); }

function startScreen(){
  document.getElementById('qcount').textContent = PBQ_DATA.questions.length + " PBQs";
  app.innerHTML = `<div class="card startbox"><h2>${esc(PBQ_DATA.title)}</h2>
  <div class="sub">Simulation rules, mirroring the real exam:</div><ul>
  <li>Questions can be skipped and returned to; your work is saved as you go.</li>
  <li>Flag questions to find them again in the review grid.</li>
  <li>Reset clears only the current question.</li>
  <li>Scoring awards partial credit per element. Keys and rationales stay sealed until you submit.</li>
  <li>Fill every field — blank elements score zero.</li></ul>
  <p><b>Time limit:</b> ${PBQ_DATA.timeLimitMin} minutes for ${PBQ_DATA.questions.length} PBQs.</p>
  <button class="btn" onclick="begin()">Begin</button></div>`;
}

function begin(){
  if(state.tick) clearInterval(state.tick);
  state.started = true;
  state.submitted = false;
  state.answers = {};
  state.flags = new Set();
  state.touched = new Set();
  PBQ_DATA.questions.forEach(q => { state.answers[q.id] = blankAnswer(q); });
  state.deadline = Date.now() + PBQ_DATA.timeLimitMin*60000;
  state.idx = 0;
  nav.style.display = 'flex';
  state.tick = setInterval(tickTimer, 500); tickTimer();
  goto(0);
}

function tickTimer(){
  const left = Math.max(0, state.deadline - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  const el = document.getElementById('timer');
  el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  el.classList.toggle('low', left < 300000);
  if(left === 0 && !state.submitted){ finishExam(true); }
}

function blankAnswer(q){
  switch(q.type){
    case 'order': return shuffle(q.items);
    case 'dropdown-grid': return q.rows.map(() => q.columns.map(() => ""));
    case 'multi-select': return [];
    case 'log-analysis': return q.questions.map(() => -1);
    case 'toggles': return q.items.map(() => null);
    case 'matching': return q.left.map(() => "");
    default: return null;
  }
}

function goto(i){
  if(i < 0 || i >= PBQ_DATA.questions.length) return;
  state.idx = i; render();
}

function render(){
  const q = PBQ_DATA.questions[state.idx];
  document.getElementById('qcount').textContent = "Question " + (state.idx+1) + " of " + PBQ_DATA.questions.length;
  document.getElementById('prevBtn').disabled = state.idx === 0;
  document.getElementById('nextBtn').disabled = state.idx === PBQ_DATA.questions.length-1;
  document.getElementById('flagBtn').textContent = state.flags.has(q.id) ? "⚑ Flagged" : "⚑ Flag";
  let h = `<div class="card"><h2>${esc(q.title)}</h2>`;
  if(state.flags.has(q.id)) h += `<div class="flagline">⚑ Flagged for review</div>`;
  h += `<div class="scenario">${esc(q.scenario)}</div><div class="instr">${esc(q.instructions)}</div>`;
  h += renderers[q.type](q);
  h += `</div>`;
  app.innerHTML = h;
  if(q.type === 'order') wireDrag(q);
}

function toggleFlag(){
  const q = PBQ_DATA.questions[state.idx];
  state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id);
  render();
}

function resetQ(){
  const q = PBQ_DATA.questions[state.idx];
  state.answers[q.id] = blankAnswer(q);
  state.touched.delete(q.id);
  render();
}

function openPalette(){
  const g = document.getElementById('pgrid'); g.innerHTML = '';
  PBQ_DATA.questions.forEach((q, i) => {
    const b = document.createElement('button');
    b.textContent = i+1;
    if(isAnswered(q)) b.classList.add('ans');
    if(i === state.idx) b.classList.add('cur');
    if(state.flags.has(q.id)) b.classList.add('flg');
    b.onclick = () => { closePalette(); goto(i); };
    g.appendChild(b);
  });
  document.getElementById('palette').style.display = 'block';
}

function closePalette(){ document.getElementById('palette').style.display = 'none'; }

function isAnswered(q){
  const a = state.answers[q.id];
  switch(q.type){
    case 'order': return state.touched.has(q.id) && a.length > 0;
    case 'dropdown-grid': return Array.isArray(a) && a.every(r => Array.isArray(r) && r.every(v => v !== ""));
    case 'multi-select': return q.selectCount ? a.length === q.selectCount : a.length > 0;
    case 'log-analysis': return Array.isArray(a) && a.every(v => v >= 0);
    case 'toggles': return Array.isArray(a) && a.every(v => v !== null);
    case 'matching': return Array.isArray(a) && a.every(v => v !== "");
    default: return false;
  }
}

const renderers = {
  'order': function(q){
    const a = state.answers[q.id];
    return a.map((it, i) => `<div class="orditem" draggable="true" data-i="${i}">
      <span class="pos">${i+1}</span><span>${esc(it)}</span>
      <span class="mv"><button onclick="moveItem('${q.id}',${i},-1)">▲</button>
      <button onclick="moveItem('${q.id}',${i},1)">▼</button></span></div>`).join('');
  },
  'dropdown-grid': function(q){
    const a = state.answers[q.id];
    let h = `<table class="grid"><tr><th>Rule</th>` + q.columns.map(c => `<th>${esc(c)}</th>`).join('') + `</tr>`;
    q.rows.forEach((r, ri) => {
      h += `<tr><td>${esc(r.label)}</td>` + q.columns.map((c, ci) =>
        `<td><select onchange="setGrid('${q.id}',${ri},${ci},this.value)">
         <option value="">—</option>${q.colOptions[c].map(o => `<option ${a[ri][ci]===o?'selected':''}>${esc(o)}</option>`).join('')}
         </select></td>`).join('') + `</tr>`;
    });
    return h + `</table>`;
  },
  'multi-select': function(q){
    const a = state.answers[q.id];
    const note = q.selectCount ? `<div class="sub">Select exactly ${q.selectCount}.</div>` : `<div class="sub">Select all that apply.</div>`;
    return note + q.options.map((o, i) =>
      `<label class="opt ${a.includes(i)?'sel':''}"><input type="checkbox" ${a.includes(i)?'checked':''} onchange="toggleMulti('${q.id}',${i})"> ${esc(o)}</label>`).join('');
  },
  'log-analysis': function(q){
    const a = state.answers[q.id];
    let h = `<div class="logbox">${esc(q.log)}</div>`;
    q.questions.forEach((sub, si) => {
      h += `<div class="instr" style="margin-top:16px">${esc(sub.prompt)}</div>` +
        sub.options.map((o, oi) => `<label class="opt ${a[si]===oi?'sel':''}"><input type="radio" name="${q.id}-${si}" ${a[si]===oi?'checked':''} onchange="setLog('${q.id}',${si},${oi})"> ${esc(o)}</label>`).join('');
    });
    return h;
  },
  'toggles': function(q){
    const a = state.answers[q.id];
    return q.items.map((it, i) => `<div class="togglerow"><span>${esc(it.label)}</span>
      <span class="seg">
        <button class="${a[i]===true?'on':''}" onclick="setToggle('${q.id}',${i},true)">ON</button>
        <button class="${a[i]===false?'off':''}" onclick="setToggle('${q.id}',${i},false)">OFF</button>
      </span></div>`).join('');
  },
  'matching': function(q){
    const a = state.answers[q.id];
    let h = `<table class="grid"><tr><th>Item</th><th>Match</th></tr>`;
    q.left.forEach((l, i) => {
      h += `<tr><td>${esc(l)}</td><td><select onchange="setMatch('${q.id}',${i},this.value)">
        <option value="">—</option>${q.right.map(r => `<option ${a[i]===r?'selected':''}>${esc(r)}</option>`).join('')}</select></td></tr>`;
    });
    return h + `</table>`;
  }
};

function moveItem(qid, i, d){
  const a = state.answers[qid]; const j = i + d;
  if(j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  touch(qid);
  render();
}

function wireDrag(q){
  const els = app.querySelectorAll('.orditem'); let from = null;
  els.forEach(el => {
    el.addEventListener('dragstart', () => { from = +el.dataset.i; el.classList.add('drag'); });
    el.addEventListener('dragend', () => el.classList.remove('drag'));
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', e => {
      e.preventDefault(); const to = +el.dataset.i; const a = state.answers[q.id];
      const [it] = a.splice(from, 1); a.splice(to, 0, it);
      touch(q.id);
      render();
    });
  });
}

function setGrid(qid, r, c, v){ state.answers[qid][r][c] = v; touch(qid); render(); }

function toggleMulti(qid, i){
  const a = state.answers[qid]; const p = a.indexOf(i);
  p >= 0 ? a.splice(p, 1) : a.push(i); 
  touch(qid); render();
}

function setLog(qid, s, o){ state.answers[qid][s] = o; touch(qid); render(); }
function setToggle(qid, i, v){ state.answers[qid][i] = v; touch(qid); render(); }
function setMatch(qid, i, v){ state.answers[qid][i] = v; touch(qid); render(); }

function scoreQ(q){
  const a = state.answers[q.id];
  switch(q.type){
    case 'order': {
      if(!state.touched.has(q.id)) return 0;
      const hit = q.answer.filter((v, i) => a[i] === v).length;
      return hit / q.answer.length;
    }
    case 'dropdown-grid': {
      let t = 0, n = 0;
      q.rows.forEach((r, ri) => r.answer.forEach((v, ci) => { n++; if(a[ri][ci] === v) t++; }));
      return t / n;
    }
    case 'multi-select': {
      const key = new Set(q.answer);
      const got = new Set(a);
      let t = 0;
      q.options.forEach((_, i) => { if(key.has(i) === got.has(i)) t++; });
      return t / q.options.length;
    }
    case 'log-analysis': {
      const t = q.questions.filter((s, si) => a[si] === s.answer).length;
      return t / q.questions.length;
    }
    case 'toggles': {
      const t = q.items.filter((it, i) => a[i] === it.answer).length;
      return t / q.items.length;
    }
    case 'matching': {
      const t = q.left.filter((_, i) => a[i] === q.answer[i]).length;
      return t / q.left.length;
    }
    default: return 0;
  }
}

function correctText(q){
  switch(q.type){
    case 'order': return "Correct order: " + q.answer.join(" → ");
    case 'dropdown-grid': return q.rows.map(r => r.label + ": " + r.answer.join(" | ")).join("\n");
    case 'multi-select': return "Correct selections: " + q.answer.map(i => q.options[i]).join("; ");
    case 'log-analysis': return q.questions.map(s => s.prompt + " → " + s.options[s.answer]).join("\n");
    case 'toggles': return q.items.map(it => it.label + ": " + (it.answer ? "ON" : "OFF")).join("\n");
    case 'matching': return q.left.map((l, i) => l + " → " + q.answer[i]).join("\n");
    default: return "";
  }
}

function finishExam(auto){
  if(state.submitted) return;
  if(!auto && !confirm("Submit the exam now? Keys and scores will be revealed. This cannot be undone.")) return;
  state.submitted = true; clearInterval(state.tick);
  closePalette(); nav.style.display = 'none';
  document.getElementById('timer').textContent = "SUBMITTED";
  let total = 0;
  const rows = PBQ_DATA.questions.map((q, i) => {
    const s = scoreQ(q); total += s;
    const cls = s >= 0.8 ? 'good' : 'poor';
    return `<div class="rev"><div class="q">${i+1}. ${esc(q.title)} — <span class="pct ${cls}">${Math.round(s*100)}%</span></div>
      <div style="font-size:14px; white-space:pre-wrap">${esc(correctText(q))}</div>
      <div class="rat">${esc(q.rationale || '')}</div></div>`;
  }).join('');
  const pct = Math.round(total / PBQ_DATA.questions.length * 100);
  app.innerHTML = `<div class="card"><h2>Results</h2>
    <div class="score">Overall PBQ score: <span class="pct ${pct>=80?'good':'poor'}">${pct}%</span>
    (per-element partial credit; the real exam's exact PBQ weighting is not published)</div>
    ${rows}
    <p style="margin-top:18px"><button class="btn" onclick="location.reload()">Retake</button></p></div>`;
  window.scrollTo(0, 0);
}

startScreen();
</script>
</body>
</html>
